# Operator cost ledger (spec VIII.1.8). Generated by `strata-bench ledger --write`.
#
# UNITS: CPU nanoseconds per unit of work from the process CPU-time clock —
# NOT cycles per row. STRATA-SYS-01-014 requires hardware counters
# (perf_event_open) on an isolated core of a HW-REF-1 runner; this ledger is
# the CPU-time stand-in until one exists (ADR-0026). Values are only
# comparable on the same hardware profile and CPU model.
#
# Regression rule (STRATA-SYS-01-015): `strata-bench ledger --check` fails when an
# entry's median exceeds `measured * (1 + 0.05 + noise_band)`. On shared,
# frequency-scaled machines (HW-REF-7) session-to-session drift exceeds
# that limit, so the check is informational there and not run in CI
# (docs/benchmarks/harness.md).

[meta]
hw_profile = "HW-REF-7"
cpu_model = "Apple M4"
load_average_at_write = "{ 4.08 5.92 6.60 }"
runs = 20
unit_kind = "cpu_ns"

[operator.crc32c]
unit = "cpu_ns_per_kib"
description = "CRC-32C over 1 MiB (WAL frames, segment chunks)"
measured = 46.4750
noise_band = 0.0284

[operator.event_batch_decode]
unit = "cpu_ns_per_row"
description = "decode a 1,000-event WAL batch payload (WAL replay path)"
measured = 1211.6117
noise_band = 0.1125

[operator.scan_filter_count]
unit = "cpu_ns_per_row_scanned"
description = "SELECT count(*) WHERE severity = 'ERROR' (1 thread)"
measured = 7.1524
noise_band = 0.0644

[operator.like_substring_count]
unit = "cpu_ns_per_row_scanned"
description = "SELECT count(*) WHERE body LIKE '%TIMEOUT%' (1 thread)"
measured = 100.3940
noise_band = 0.0292

[operator.group_by_high_cardinality]
unit = "cpu_ns_per_row_scanned"
description = "GROUP BY attributes['user_id'] ORDER BY count DESC LIMIT 10 (1 thread)"
measured = 103.0665
noise_band = 0.0406

[operator.group_by_low_cardinality]
unit = "cpu_ns_per_row_scanned"
description = "GROUP BY severity (1 thread)"
measured = 68.3837
noise_band = 0.0528

[operator.top_k_order_by_time]
unit = "cpu_ns_per_row_scanned"
description = "ORDER BY event_time DESC LIMIT 10 (1 thread)"
measured = 264.5225
noise_band = 0.0463
