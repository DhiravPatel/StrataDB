# Data-path crate: storage file data is read and written only through
# stratadb_common::io (spec STRATA-SYS-04-001, ADR-0027), which handles short
# reads/writes, retries, identity checks, the open-file budget and the
# power-loss recorder hooks. Namespace operations (rename, directory fsync,
# unlink) go through stratadb_common::fsutil.

# Repeats the workspace clippy.toml (a crate-level file replaces it).
allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-methods = [
    { path = "std::fs::read", reason = "read storage files through stratadb_common::io (STRATA-SYS-04-001)" },
    { path = "std::fs::read_to_string", reason = "read storage files through stratadb_common::io (STRATA-SYS-04-001)" },
    { path = "std::fs::write", reason = "write storage files through stratadb_common::io (STRATA-SYS-04-001)" },
    { path = "std::fs::File::open", reason = "open storage files through stratadb_common::io (STRATA-SYS-04-001)" },
    { path = "std::fs::File::create", reason = "create storage files through stratadb_common::io (STRATA-SYS-04-001)" },
    { path = "std::fs::OpenOptions::open", reason = "open storage files through stratadb_common::io (STRATA-SYS-04-001)" },
    { path = "std::os::unix::fs::FileExt::read_at", reason = "read through stratadb_common::io (STRATA-SYS-04-001)" },
    { path = "std::os::unix::fs::FileExt::read_exact_at", reason = "read through stratadb_common::io (STRATA-SYS-04-001)" },
    { path = "std::os::unix::fs::FileExt::write_at", reason = "write through stratadb_common::io (STRATA-SYS-04-001)" },
    { path = "std::os::unix::fs::FileExt::write_all_at", reason = "write through stratadb_common::io (STRATA-SYS-04-001)" },
]
