[package]
name = "stratadb-client"
description = "Rust client SDK for the StrataDB HTTP API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
stratadb-server = { path = "../../apps/stratadb-server" }
stratadb-storage.workspace = true
stratadb-common.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tempfile.workspace = true
rcgen = "0.14"

[lints]
workspace = true
