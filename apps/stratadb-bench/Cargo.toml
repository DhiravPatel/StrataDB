[package]
name = "stratadb-bench"
description = "Reproducible StrataDB ingest + query-suite benchmark harness (raw JSON output)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "strata-bench"
path = "src/main.rs"

[dependencies]
stratadb-common.workspace = true
stratadb-schema.workspace = true
stratadb-storage.workspace = true
stratadb-query.workspace = true
stratadb-testkit.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
