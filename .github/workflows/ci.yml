name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      # SDK conformance tests drive these toolchains (they skip if absent).
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Modules for the official-OTel-exporter interop test (built offline in the test).
      - run: cd tools/otlp-interop && go mod download
      - run: cargo fmt --all -- --check
      - name: layer check (STRATA-ARCH-01-002)
        run: python3 scripts/check_layers.py --self-test && python3 scripts/check_layers.py
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes crash matrix, power-loss model, restore drills, stable mutation fuzzing,
      # and Rust/Python/Go SDK conformance against a real server.
      - run: cargo test --workspace --locked
      - run: cd sdk/go && gofmt -l . | (! grep .) && go vet ./...

  perf-smoke:
    # Smoke-level performance checks only: shared CI VMs are not benchmark
    # runners (spec STRATA-SYS-19-006). Verifies the harness, manifests, plan
    # assertions and open-loop generator; timings are archived, not gated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.95.0" }
      - run: python3 scripts/spec_inventory.py --check
      - run: cargo build --release --locked -p stratadb-bench
      - run: target/release/strata-bench scenario benchmarks/scenarios/smoke.toml --out perf-smoke --hw-profile CI-SHARED
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-smoke
          path: perf-smoke/

  parquet-interop:
    # Parquet export read back by independent implementations (ADR-0025).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.95.0" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyarrow duckdb
      - run: scripts/parquet_interop.sh

  audit-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.95.0" }
      - run: cargo install cargo-audit cargo-cyclonedx --locked
      - run: cargo audit
      - run: cargo cyclonedx --format json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/*.cdx.json"

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: 30 s per target
        run: |
          cd fuzz
          for t in wal_frames wal_recovery segment segment_internals manifest event_codec query json_event otlp_proto config security_files cursor sealed map_projection; do
            cargo fuzz run "$t" -- -max_total_time=30 -rss_limit_mb=2048
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deployments/docker/Dockerfile -t stratadb:ci .
      - name: image runs as non-root and the binary starts
        run: |
          test "$(docker run --rm --entrypoint id stratadb:ci -u)" = "10001"
          docker run --rm --entrypoint strata-server stratadb:ci --version
