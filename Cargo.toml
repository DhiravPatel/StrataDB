[workspace]
resolver = "2"
members = [
    "crates/stratadb-common",
    "crates/stratadb-crypto",
    "crates/stratadb-schema",
    "crates/stratadb-wal",
    "crates/stratadb-segment",
    "crates/stratadb-storage",
    "crates/stratadb-query",
    "crates/stratadb-testkit",
    "crates/stratadb-fuzz",
    "apps/stratadb-cli",
    "apps/stratadb-bench",
    "apps/stratadb-server",
    "apps/stratadb-studio",
    "sdk/rust",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
publish = false
# License intentionally not declared yet: see docs/adr/0016-license.md (pending owner sign-off).

[workspace.dependencies]
stratadb-common = { path = "crates/stratadb-common" }
stratadb-schema = { path = "crates/stratadb-schema" }
stratadb-wal = { path = "crates/stratadb-wal" }
stratadb-segment = { path = "crates/stratadb-segment" }
stratadb-storage = { path = "crates/stratadb-storage" }
stratadb-crypto = { path = "crates/stratadb-crypto" }
stratadb-query = { path = "crates/stratadb-query" }
stratadb-testkit = { path = "crates/stratadb-testkit" }

thiserror = "2"
crc32c = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "std"] }
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
sha2 = "0.10"
# Safe syscall wrappers (already a transitive dependency via tempfile); used
# for CPU-time clocks in benchmarks and accounting (ADR-0026).
rustix = { version = "1", default-features = false, features = ["std", "time", "process"] }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
# Already in the tree via rustls (TLS); reused for encryption at rest (ADR-0024).
ring = "0.17"
# HashTable for flat aggregation groups (already in the lockfile; no deps).
hashbrown = { version = "0.17", default-features = false }
# Randomly seeded fast hasher for aggregation groups (already in the lockfile via parquet).
ahash = { version = "0.8", default-features = false, features = ["std", "runtime-rng"] }
zeroize = "1"
# Lock-free publication of the engine's read view (snapshot catalog,
# STRATA-SYS-17-001; no dependencies; ADR-0039).
arc-swap = { version = "1.7", default-features = false }
# SIMD substring search for LIKE (already in the lockfile via aho-corasick/regex;
# no dependencies; ADR-0038).
memchr = { version = "2.8", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
# Reduced debug info keeps target/ small on space-constrained dev machines.
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Release binaries (spec VIII.18, STRATA-SYS-18-001; ADR-0026). `panic =
# "abort"`: a panic in the data path is a bug; the process exits and the
# service manager restarts it (deployments/systemd: Restart=on-failure), and
# recovery replays the WAL. Tests always unwind (the test profile is separate).
[profile.release]
opt-level = 3
debug = "line-tables-only"
lto = "fat"
codegen-units = 1
panic = "abort"

# Release optimizations with debug assertions and overflow checks enabled
# (STRATA-SYS-18-005): nightly CI runs the full test suite with it.
[profile.release-checked]
inherits = "release"
debug-assertions = true
overflow-checks = true
panic = "unwind"
lto = "thin"
