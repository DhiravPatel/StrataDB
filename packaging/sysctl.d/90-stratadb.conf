# StrataDB production sysctl baseline (spec VIII.2.2, STRATA-SYS-02-005).
# Install: cp 90-stratadb.conf /etc/sysctl.d/ && sysctl --system
# StrataDB never changes sysctls itself (STRATA-SYS-02-004); `strata doctor
# host` checks these values and explains deviations. Review the network
# values for your environment (bbr needs the tcp_bbr module; use dctcp on
# ECN-enabled data-centre fabrics).

vm.swappiness = 1
vm.dirty_background_bytes = 268435456
vm.dirty_bytes = 1073741824
vm.dirty_expire_centisecs = 1000
vm.dirty_writeback_centisecs = 100
vm.max_map_count = 1048576
vm.overcommit_memory = 0
vm.zone_reclaim_mode = 0
# At least 1% of RAM, at most 4 GiB: adjust to the host (1 GiB here).
vm.min_free_kbytes = 1048576

fs.file-max = 4194304
fs.aio-max-nr = 1048576
fs.nr_open = 4194304

kernel.numa_balancing = 0
kernel.sched_autogroup_enabled = 0
kernel.perf_event_paranoid = 1

net.core.somaxconn = 65535
net.core.netdev_max_backlog = 250000
net.core.rmem_max = 268435456
net.core.wmem_max = 268435456
net.ipv4.tcp_rmem = 4096 1048576 268435456
net.ipv4.tcp_wmem = 4096 1048576 268435456
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_tw_reuse = 1
net.ipv4.ip_local_port_range = 1024 65535
